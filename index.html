img{max-width:100%;height:auto;display:block}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.15;font-weight:700}
p{margin:0}

/* Barra superior */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:1rem;padding:.6rem var(--gutter);min-height:60px}
.topbar img{width:40px;height:40px;flex:none}
.topbar-id{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.topbar-id strong{font-size:var(--fs-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-id span{font-size:var(--fs-xs);color:var(--muted)}
.period{margin-left:auto;display:flex;align-items:center;gap:.5rem;font-size:var(--fs-sm)}
.period label{color:var(--muted)}
.period select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:.35rem 1.8rem .35rem .6rem;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 14px) 55%,calc(100% - 9px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.period .single{font-weight:600}

/* Pestañas de informes */
.reports{position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);z-index:19;background:var(--bg);border-bottom:1px solid var(--line)}
.reports-in{display:flex;align-items:center;gap:1rem;height:46px;padding:0 var(--gutter)}
.reports-lab{flex:none;font-size:var(--fs-xs);font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.reports-tabs{display:flex;align-self:stretch;gap:.15rem;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.reports-tabs::-webkit-scrollbar{display:none}
.reports-tabs button{flex:none;display:inline-flex;align-items:center;gap:.5rem;font:inherit;font-size:var(--fs-sm);color:var(--ink-2);background:none;border:0;border-bottom:2px solid transparent;padding:0 .8rem;cursor:pointer;white-space:nowrap}
.reports-tabs button:hover{color:var(--ink);background:var(--surface)}
.reports-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand);font-weight:600}
.reports-tabs button strong{font-weight:700}
.reports-tabs button:focus-visible{outline-offset:-2px}
.vig,.rev{font-size:.6875rem;font-weight:600;line-height:1;padding:.25rem .5rem;border-radius:999px;letter-spacing:.02em}
.vig{color:var(--brand);background:var(--brand-soft)}
.rev{color:var(--ochre-ink);border:1px solid var(--ochre)}
.pdf-btn{flex:none;display:inline-flex;align-items:center;gap:.45rem;font-size:var(--fs-sm);font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:.35rem .75rem;text-decoration:none;cursor:pointer}
.pdf-btn:hover{border-color:var(--brand);color:var(--brand)}
.pdf-btn svg{width:16px;height:16px;flex:none}
.pdf-btn[aria-busy="true"]{opacity:.65;cursor:progress}
.p-num{color:var(--muted);font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 1.25rem);transform:translateX(-50%);z-index:30;max-width:calc(100vw - 2rem);background:var(--ink);color:var(--bg);font-size:var(--fs-sm);padding:.55rem .95rem;border-radius:var(--radius);box-shadow:0 8px 24px var(--shadow)}
.toast:empty{display:none}

/* Estructura */
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);max-width:1360px;margin:0 auto}
.index{position:sticky;top:calc(env(safe-area-inset-top,0px) + 108px);align-self:start;height:calc(100vh - 108px);overflow:auto;
  padding:1.75rem 1rem 2rem var(--gutter);border-right:1px solid var(--line-2)}
.index ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.1rem}
.index a{display:flex;align-items:center;gap:.55rem;color:var(--ink-2);text-decoration:none;font-size:var(--fs-sm);padding:.32rem .5rem;border-radius:var(--radius);border-left:2px solid transparent}
.index a:hover{background:var(--surface);color:var(--ink)}
.index a.is-active{color:var(--ink);font-weight:600;border-left-color:var(--brand);background:var(--surface)}
.index .dot{width:7px;height:7px;border-radius:50%;flex:none;background:transparent}
.index .dot.verde{background:var(--olive)}.index .dot.amarillo{background:var(--ochre)}.index .dot.rojo{background:var(--red)}
main{min-width:0}
.sec{padding:3.25rem var(--gutter);border-bottom:1px solid var(--line-2)}
.sec-in{max-width:1040px}
.sec-head{max-width:68ch;margin-bottom:1.75rem}
.sec-head h2{font-size:var(--fs-xl);letter-spacing:-.01em}
.lede{margin-top:.6rem;font-size:var(--fs-md);line-height:1.45;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.85rem}
.chip{display:inline-flex;align-items:center;gap:.4rem;font-size:var(--fs-xs);padding:.2rem .55rem .2rem .45rem;border:1px solid var(--line);border-radius:999px;color:var(--ink-2)}
.chip i{width:8px;height:8px;border-radius:50%}
.chip.verde i{background:var(--olive)}.chip.amarillo i{background:var(--ochre)}.chip.rojo i{background:var(--red)}
h3{font-size:var(--fs-md);margin:2.25rem 0 .9rem}
h3:first-child{margin-top:0}
.note{font-size:var(--fs-sm);color:var(--muted);max-width:72ch}
.src{font-size:var(--fs-xs);color:var(--muted);margin-top:.6rem}

/* Portada */
.hero{background:var(--band);padding:2.75rem var(--gutter) 0;border-bottom:0}
.hero-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:2.5rem;align-items:end;max-width:1180px}
.hero-kicker{font-size:var(--fs-sm);color:var(--muted)}
.hero h1{font-size:clamp(2.2rem,4.4vw,3.5rem);font-weight:800;letter-spacing:-.02em;line-height:1.02;margin:.5rem 0 .9rem;text-wrap:balance}
.nw{white-space:nowrap}
.hero-period{font-size:var(--fs-lg);font-weight:500}
.hero-period > span{display:block;font-size:var(--fs-sm);color:var(--muted);font-weight:400;margin-top:.15rem}
.hero-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.85rem 1.5rem;margin:2rem 0 2.75rem;padding-top:1.25rem;border-top:1px solid var(--line)}
.hero-meta dt{font-size:var(--fs-xs);color:var(--muted)}
.hero-meta dd{margin:0;font-weight:600;font-size:var(--fs-sm)}
.hero-photo{margin:0;position:relative}
.hero-photo button{all:unset;cursor:zoom-in;display:block;width:100%}
.hero-photo img{width:100%;aspect-ratio:4/3.1;object-fit:cover;border-radius:var(--radius) var(--radius) 0 0}
.hero-photo figcaption{position:absolute;left:0;bottom:0;background:var(--bg);color:var(--ink-2);font-size:var(--fs-xs);padding:.35rem .7rem;border-top-right-radius:var(--radius)}

/* Regla de avance */
.regla{background:var(--bg)}
.tape{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr) 92px;column-gap:1rem;row-gap:0;position:relative}
.tape-axis{grid-column:2;height:34px;position:relative;
  background-image:linear-gradient(to right,var(--muted) 1px,transparent 1px),linear-gradient(to right,var(--line) 1px,transparent 1px);
  background-size:10% 14px,2% 7px;background-repeat:repeat-x;background-position:0 100%,0 100%;border-bottom:1px solid var(--muted)}
.tape-axis span{position:absolute;bottom:17px;transform:translateX(-50%);font-size:var(--fs-xs);color:var(--muted)}
.tape-axis span:last-child{transform:translateX(-100%)}
.tape-axis span:first-child{transform:none}
.t-label{grid-column:1;padding:.85rem 0 .7rem;border-bottom:1px solid var(--line-2);line-height:1.25}
.t-label strong{display:block;font-size:var(--fs-sm);font-weight:600}
.t-label small{font-size:var(--fs-xs);color:var(--muted)}
.t-track{grid-column:2;position:relative;border-bottom:1px solid var(--line-2);display:flex;align-items:center;min-height:58px}
.t-track::after{content:"";position:absolute;top:0;bottom:-1px;left:var(--x);border-left:1.5px dashed var(--brand);z-index:1}
.tape-reflab{grid-column:2;position:relative;height:1.8rem}
.tape-reflab span{position:absolute;top:.4rem;left:var(--x);transform:translateX(-50%);font-size:var(--fs-xs);color:var(--brand);white-space:nowrap;font-weight:600}
.t-bar{height:20px;width:var(--v);background:var(--c);transform-origin:left;animation:grow .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
.t-val{grid-column:3;border-bottom:1px solid var(--line-2);display:flex;align-items:center;justify-content:flex-end;font-size:var(--fs-lg);font-weight:700;letter-spacing:-.01em}
.t-main .t-label strong,.t-main .t-val{color:var(--brand)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.t-bar{animation:none}}
.tape-foot{margin-top:2.25rem}

/* Semáforo */
.sema{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.sema li{display:grid;grid-template-columns:118px minmax(0,1.1fr) minmax(0,1.6fr);gap:1rem;align-items:baseline;padding:.95rem 0 .95rem 1rem;border-bottom:1px solid var(--line);position:relative}
.sema li::before{content:"";position:absolute;left:0;top:.7rem;bottom:.7rem;width:4px;background:var(--c)}
.sema .verde{--c:var(--olive)}.sema .amarillo{--c:var(--ochre)}.sema .rojo{--c:var(--red)}
.status{font-size:var(--fs-sm);font-weight:700;color:var(--c)}
.sema .verde .status{color:var(--olive-ink)}.sema .amarillo .status{color:var(--ochre-ink)}
.sema a{color:var(--ink);font-weight:600;text-decoration:none;font-size:var(--fs-sm)}
.sema a:hover{text-decoration:underline;color:var(--brand)}
.sema p{font-size:var(--fs-sm);color:var(--ink-2)}

/* Estadísticas en línea */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin:0 0 1.75rem;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats>div{padding:1rem 1.1rem 1rem 0;margin:0}
.stats>div+div{padding-left:1.1rem;border-left:1px solid var(--line-2)}
.stats dt{font-size:var(--fs-xs);color:var(--muted)}
.stats dd{margin:0}
.stats .num{font-size:var(--fs-lg);font-weight:700;letter-spacing:-.01em;line-height:1.2;margin-top:.15rem}
.stats .sub{font-size:var(--fs-xs);color:var(--ink-2);margin-top:.15rem}
.num.pos{color:var(--olive-ink)}.num.neg{color:var(--red)}

/* Tablas */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:var(--fs-sm)}
th,td{text-align:left;padding:.55rem .75rem .55rem 0;border-bottom:1px solid var(--line-2);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:var(--fs-xs);border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right}
td.r{white-space:nowrap}
tr.total td{font-weight:700;border-top:1px solid var(--line);border-bottom:0}
td .neg{color:var(--red);font-weight:600}
td .pos{color:var(--olive-ink);font-weight:600}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 2.5rem}
.kv dl{margin:0}
.kv div{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--line-2);font-size:var(--fs-sm)}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;text-align:right}

/* Gráficos */
.chart{position:relative;height:330px;margin:.25rem 0 .5rem}
.chart.sm{height:280px}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1.25rem;font-size:var(--fs-xs);color:var(--ink-2);margin-bottom:.6rem}
.legend span{display:inline-flex;align-items:center;gap:.4rem}
.legend i{width:14px;height:10px;background:var(--c)}
.legend i.line{height:3px}
.legend i.dash{height:0;border-top:3px dashed var(--c);background:none}

/* Barras horizontales */
.hbars{display:grid;grid-template-columns:minmax(120px,auto) minmax(0,1fr) auto;gap:.15rem 1rem;align-items:center;font-size:var(--fs-sm)}
.hbars .lab{padding:.4rem 0}
.hbars .trk{height:14px;background:var(--track);position:relative}
.hbars .trk b{position:absolute;left:0;top:0;bottom:0;width:var(--v);background:var(--c,var(--brand))}
.hbars .val{text-align:right;font-weight:600;white-space:nowrap}
.hbars .val small{color:var(--muted);font-weight:400;margin-left:.4rem}
.hbars .hd{font-size:var(--fs-xs);color:var(--muted);padding-bottom:.2rem;border-bottom:1px solid var(--line)}

/* Barra apilada contrato */
.stack{display:flex;height:44px;width:100%;margin:.5rem 0 .9rem}
.stack div{background:var(--c);display:flex;align-items:center;padding:0 .6rem;color:#fff;font-weight:700;font-size:var(--fs-sm);min-width:0;overflow:hidden;white-space:nowrap}
.stack div.light{color:var(--ink);background:var(--track)}
@media (max-width:600px){.stack .stk-sm{display:none}}
.stack-legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;font-size:var(--fs-sm)}
.stack-legend div{border-top:3px solid var(--c);padding-top:.45rem}
.stack-legend strong{display:block;font-size:var(--fs-md);}
.stack-legend span{color:var(--muted);font-size:var(--fs-xs)}

/* Hitos del programa */
.tl{position:relative;margin:1.25rem 0 0}
.tl-track{position:relative;height:56px;margin:0 .5rem}
.tl-line{position:absolute;left:0;right:0;top:34px;height:4px;background:var(--track)}
.tl-done{position:absolute;left:0;top:34px;height:4px;background:var(--brand);width:var(--x)}
.tl-dot{position:absolute;top:28px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--bg);border:2px solid var(--muted);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.tl-dot.past{border-color:var(--brand);color:var(--brand)}
.tl-dot.up{top:8px}
.tl-dot.up::after{content:"";position:absolute;left:50%;top:14px;height:8px;border-left:1.5px solid var(--brand)}
.tl-now{position:absolute;top:0;margin-left:-1px;height:48px;border-left:2px solid var(--ink)}
.tl-now span{position:absolute;top:-2px;left:6px;font-size:var(--fs-xs);font-weight:700;white-space:nowrap}
.tl-now.flip span{left:auto;right:6px}
.tl-ends{display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--muted);margin:.35rem .5rem 0}
.tl-list{list-style:none;margin:1.25rem 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.9rem 1.25rem;counter-reset:h}
.tl-list li{font-size:var(--fs-sm);line-height:1.3;padding-left:1.6rem;position:relative;counter-increment:h}
.tl-list li::before{content:counter(h);position:absolute;left:0;top:.05rem;width:1.15rem;height:1.15rem;border-radius:50%;border:1.5px solid var(--muted);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.tl-list li.past::before{border-color:var(--brand);color:var(--brand)}
.tl-list small{display:block;color:var(--muted);font-size:var(--fs-xs);margin-top:.1rem}

/* Figuras y fotos */
.fig{margin:1.5rem 0 0}
.fig button,.ph button{all:unset;cursor:zoom-in;display:block;width:100%}
.fig button:focus-visible,.ph button:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
.fig img{width:100%;border:1px solid var(--line-2);background:#fff}
.fig figcaption{font-size:var(--fs-xs);color:var(--muted);margin-top:.5rem}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2rem}

details{border-top:1px solid var(--line);margin-top:1.75rem}
details:last-child{border-bottom:1px solid var(--line)}
summary{cursor:pointer;padding:.85rem 0;font-weight:600;font-size:var(--fs-sm);list-style:none;display:flex;align-items:center;gap:.6rem}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .2s}
details[open] summary::before{transform:rotate(45deg)}
details>div{padding:0 0 1.25rem}

/* Calidad */
.qa{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:1.5rem;padding:1.25rem;border-top:1px solid var(--line);border-left:4px solid transparent}
.qa.critica{border-top:0;background:var(--red-soft);border-left-color:var(--red)}
.qa h4{margin:0 0 .5rem;font-size:var(--fs-sm);font-weight:700}
.qa.critica h4{color:var(--red)}
.qa dl{margin:.75rem 0 0;display:grid;gap:.6rem}
.qa dt{font-size:var(--fs-xs);font-weight:700;color:var(--ink-2)}
.qa dd{margin:.1rem 0 0;font-size:var(--fs-sm)}
.qa .ph img{aspect-ratio:3/4;object-fit:cover;width:100%;border-radius:var(--radius)}
ul.plain{margin:0;padding-left:1.1rem;font-size:var(--fs-sm);display:grid;gap:.45rem;max-width:75ch}
ul.plain li::marker{color:var(--brand)}

/* Galería */
.filters{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.25rem}
.filters button{font:inherit;font-size:var(--fs-sm);padding:.35rem .8rem;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink-2);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters button small{opacity:.7;margin-left:.3rem}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.25rem 1rem}
.ph{margin:0}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--radius);background:var(--track)}
.ph figcaption{font-size:var(--fs-xs);margin-top:.45rem;line-height:1.3;color:var(--ink-2)}
.ph figcaption strong{display:block;font-size:var(--fs-sm);color:var(--ink)}

/* Visor */
dialog.lb{border:0;padding:0;max-width:min(1200px,96vw);max-height:96vh;width:auto;background:var(--bg);color:var(--ink);border-radius:var(--radius);box-shadow:0 20px 60px var(--shadow)}
dialog.lb::backdrop{background:rgba(8,16,24,.82)}
.lb-fig{margin:0;display:flex;flex-direction:column}
.lb-fig img{max-height:calc(96vh - 64px);max-width:100%;width:auto;margin:0 auto;object-fit:contain;background:#000}
.lb-bar{display:flex;align-items:center;gap:.75rem;padding:.6rem .75rem;font-size:var(--fs-sm)}
.lb-cap{flex:1;min-width:0}
.lb-cap small{color:var(--muted);margin-left:.4rem}
.lb-bar button{font:inherit;font-size:var(--fs-sm);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--radius);padding:.35rem .7rem;cursor:pointer}

footer.foot{padding:2.5rem var(--gutter) 3rem;font-size:var(--fs-sm);color:var(--muted);display:flex;flex-wrap:wrap;gap:1.5rem 3rem;align-items:flex-start}
footer.foot img{width:112px}
.logo-d{display:none!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-l{display:none!important}:root:not([data-theme="light"]) .logo-d{display:block!important}}
:root[data-theme="dark"] .logo-l{display:none!important}
:root[data-theme="dark"] .logo-d{display:block!important}
footer.foot strong{color:var(--ink)}

/* Responsivo */
@media (max-width:1080px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .index{position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);z-index:15;height:auto;background:var(--bg);border-right:0;border-bottom:1px solid var(--line);padding:.45rem var(--gutter);overflow-x:auto;scrollbar-width:none}
  .index::-webkit-scrollbar{display:none}
  .index ol{flex-direction:row;gap:.25rem;white-space:nowrap}
  .index a{border-left:0;border-bottom:2px solid transparent;border-radius:0;padding:.35rem .55rem}
  .index a.is-active{border-bottom-color:var(--brand);background:transparent}
  html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 112px)}
  .reports{position:static}
}
@media (max-width:820px){
  .hero-grid{grid-template-columns:minmax(0,1fr);gap:1.5rem}
  .hero-photo{order:-1;margin:0 calc(var(--gutter) * -1)}
  .hero-photo img{border-radius:0;aspect-ratio:16/10}
  .hero-meta{margin-bottom:2rem}
  .two,.kv{grid-template-columns:minmax(0,1fr);gap:0}
  .two{gap:1.75rem}
  .tl-list{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sema li{grid-template-columns:minmax(0,1fr);gap:.2rem}
  .qa{grid-template-columns:minmax(0,1fr) 120px;gap:1rem}
}
@media (max-width:600px){
  :root{--fs-xl:1.6rem;--fs-lg:1.3rem;--fs-md:1.0625rem}
  .sec{padding:2.5rem var(--gutter)}
  .topbar-id span{display:none}
  .period label{display:none}
  .p-num,.reports-lab,.pdf-txt{display:none}
  .reports-in{gap:.5rem}
  .reports-tabs button{padding:0 .6rem}
  .pdf-btn{padding:.35rem .6rem}

  .tape-axis span{font-size:.6875rem}
  .tape-reflab{grid-column:1}
  .t-label{grid-column:1 / -1;border-bottom:0;padding:.75rem 0 .2rem}
  .t-track{grid-column:1;min-height:30px}
  .t-val{grid-column:2}
  .t-bar{height:14px}
  .stack-legend{grid-template-columns:minmax(0,1fr)}
  .hbars{grid-template-columns:minmax(0,1fr) auto}
  .hbars .lab{grid-column:1 / -1;padding:.55rem 0 0}
  .hbars .hd.trkh{display:none}

  .chart{height:280px}
  .qa{grid-template-columns:minmax(0,1fr)}
  .qa .ph img{aspect-ratio:4/3}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats>div+div{padding-left:0;border-left:0}
  .stats>div:nth-child(even){padding-left:1rem;border-left:1px solid var(--line-2)}
  .stats>div:nth-child(n+3){border-top:1px solid var(--line-2)}
}

@page{size:A4}
@media print{

/* Garantías: boletas de anticipo */
.boletas{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem 1.25rem;margin:0 0 1.25rem}
.bol-cells{display:flex;gap:4px;flex:none}
.bol-cells i{width:16px;height:24px;border-radius:2px;background:var(--brand)}
.bol-cells i.dev{background:transparent;border:1.5px dashed var(--muted)}
.boletas p{font-size:var(--fs-sm);color:var(--ink-2);flex:1 1 280px;min-width:0}
.boletas p strong{color:var(--ink)}

/* Estado de adicionales */
.est{display:inline-block;font-size:var(--fs-xs);font-weight:600;line-height:1.3;padding:.1rem .5rem;border-radius:999px;white-space:nowrap}
.est.ok{color:var(--olive-ink);background:var(--olive-soft)}
.est.no{color:var(--red);background:var(--red-soft)}
.est.na{color:var(--muted);border:1px solid var(--line)}

/* Hitos sin fecha y hechos del mes */
.tl-list li.pend::before{border-style:dashed}
.tl-dot.ok,.tl-list li.ok::before{background:var(--brand);border-color:var(--brand);color:var(--bg)}
ol.hechos{list-style:none;margin:1.25rem 0 0;padding:0;counter-reset:hh;border-top:1px solid var(--line);max-width:80ch}
ol.hechos li{display:grid;grid-template-columns:1.6rem auto minmax(0,1fr);gap:.75rem;align-items:baseline;padding:.6rem 0;border-bottom:1px solid var(--line-2);font-size:var(--fs-sm);counter-increment:hh}
ol.hechos li::before{content:counter(hh);width:1.15rem;height:1.15rem;border-radius:50%;border:1.5px solid var(--brand);color:var(--brand);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;align-self:center}
ol.hechos time{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Comparaciones de inicio y fin de mes */
.pairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2rem}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem;align-content:start;min-width:0}
.pair-h{grid-column:1 / -1;font-weight:600;font-size:var(--fs-sm)}
.pair .ph img{aspect-ratio:4/3}
.gallery.wide .ph img{aspect-ratio:3/2}
@media (max-width:820px){.pairs{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){ol.hechos li{grid-template-columns:1.4rem auto minmax(0,1fr);gap:.5rem}}
@media print{.pair,.boletas,ol.hechos li{break-inside:avoid}}

  };
  R.d.ritmo = A.ejecutado / R.d.transcurrido;
  R.d.brecha = (R.d.certificado - A.ejecutado) * 100;
  return R;
}

/* Avance necesario por mes para terminar en plazo, y avance del último mes */
function ritmoTermino(R){
  const ej = R.avance.ejecutado, rest = R.plazo.restantes;
  const req = rest > 0 ? (1 - ej) * 100 * 30 / rest : null;
  const prev = INFORMES.filter(x => x.numero < R.numero).sort((a,b) => b.numero - a.numero)[0];
  let ult = null, sub = "";
  if (prev){ ult = (ej - prev.avance.ejecutado) * 100; sub = `Del ${prev.cierre} al ${R.cierre}`; }
  else if (R.semanal && R.semanal.real && R.semanal.real.length >= 4){ ult = R.semanal.real.slice(-4).reduce((a,b)=>a+b,0) * 30 / 28; sub = "Últimas 4 semanas, llevado a 30 días"; }
  return { req, ult, sub };
}
function ledeRitmo(R){
  const T = ritmoTermino(R); if (T.req == null) return "";
  return ` Para terminar en plazo debe avanzar ${n(T.req,1)}% por mes${T.ult != null ? `; en el último mes avanzó ${n(T.ult,1)}%` : ""}.`;
}
function bloqueRitmo(R){
  const T = ritmoTermino(R); if (T.req == null) return "";
  const fin = R.proyecto.termino;
  const nota = T.ult == null
    ? `Es el avance promedio que la obra debe lograr cada mes, desde el cierre hasta el ${fin}, para llegar al 100% en la fecha de término.`
    : T.ult >= T.req
      ? `El avance del último mes alcanza el ritmo necesario para terminar en la fecha de término (${fin}).`
      : `Para terminar el ${fin}, la obra debe avanzar en promedio ${n(T.req,1)}% por mes, más que el ${n(T.ult,1)}% logrado en el último mes.`;
  return `
    <h3>Ritmo para terminar en plazo</h3>
    <dl class="stats">
      ${stat("Avance necesario por mes", n(T.req,1)+"%", `Promedio hasta el ${fin}`)}
      ${T.ult != null ? stat("Avance del último mes", n(T.ult,1)+"%", T.sub) : ""}
    </dl>
    <p class="note" style="margin-top:-.75rem">${nota}</p>`;
}

function vHitos(R){
  const H = R.hitosContrato, P = R.proyecto;
  const ini = toDate(P.inicio), fin = toDate(P.termino), hoy = toDate(R.cierre);
  const pos = d => ((d - ini) / (fin - ini)) * 100, xHoy = pos(hoy);
  const ok = h => !!h.real && toDate(h.real) <= hoy;
  const cuando = h => ok(h) ? h.real : h.fecha;
  const dif = h => { const d = Math.round((toDate(h.fecha) - toDate(h.real)) / 864e5); return d>0 ? `${d} días antes de lo comprometido` : d<0 ? `${-d} días después de lo comprometido` : "en la fecha comprometida"; };
  const fechados = H.map((h,i)=>({...h, i})).filter(h=>cuando(h)).sort((a,b)=>toDate(cuando(a))-toDate(cuando(b)));
  let prev = -99, lift = false;
  const dots = fechados.map(h=>{ const d = toDate(cuando(h)), x = pos(d); lift = (x - prev < 3.5) ? !lift : false; prev = x;
    return `<div class="tl-dot ${ok(h)?"ok":d<=hoy?"past":""} ${lift?"up":""}" style="left:${x}%" title="${h.nombre}, ${ok(h)?`terminado el ${h.real} (comprometido ${h.fecha})`:h.fecha}">${h.i+1}</div>`; }).join("");
  const [, mm, yy] = R.cierre.split("-"), diasMes = new Date(+yy, +mm, 0).getDate();
  let pd = -1, up = false;
  const mdots = R.hechos.map((h,i)=>{ up = h.dia===pd ? !up : false; pd = h.dia; return `<div class="tl-dot past ${up?"up":""}" style="left:${(h.dia-1)/(diasMes-1)*100}%" title="${String(h.dia).padStart(2,"0")}-${mm}: ${h.texto}">${i+1}</div>`; }).join("");
  return sec("hitos", head(R,"hitos","Hitos y hechos relevantes", R.hitosNota) + `
    <h3>Hitos contractuales</h3>
    <div class="tl" aria-hidden="true">
      <div class="tl-track">
        <div class="tl-line"></div><div class="tl-done" style="--x:${xHoy}%"></div>
        <div class="tl-now ${xHoy>75?"flip":""}" style="left:${xHoy}%"><span>Cierre ${R.cierre}</span></div>
        ${dots}
      </div>
      <div class="tl-ends"><span>Inicio ${P.inicio}</span><span>Término ${P.termino}</span></div>
    </div>
    <ol class="tl-list">${H.map(h=>`<li class="${ok(h)?"ok":h.fecha&&toDate(h.fecha)<=hoy?"past":""} ${h.fecha?"":"pend"}">${h.nombre}<small>${ok(h)?`Terminado el ${h.real}, ${dif(h)} (${h.fecha})`:h.fecha||"Sin fecha"}${h.nota?` · ${h.nota}`:""}</small></li>`).join("")}</ol>
    <p class="src">Los hitos rellenos están cumplidos y se ubican en su fecha real. Los hitos en azul tienen fecha comprometida anterior al cierre del período, sin fecha real registrada en el informe.</p>

    <h3>Hechos relevantes de ${R.periodo.toLowerCase()}</h3>
    <div class="tl" aria-hidden="true">
      <div class="tl-track"><div class="tl-line"></div><div class="tl-done" style="--x:100%"></div>${mdots}</div>
      <div class="tl-ends"><span>01-${mm}</span><span>${diasMes}-${mm}</span></div>
    </div>
    <ol class="hechos">${R.hechos.map(h=>`<li><time>${String(h.dia).padStart(2,"0")}-${mm}-${yy}</time><span>${h.texto}</span></li>`).join("")}</ol>`);
}

let charts = [];
function drawCharts(R){
  charts.forEach(c=>c.destroy()); charts = [];
  if (!window.Chart) return;
  const ink = css("--ink"), muted = css("--muted"), line = css("--line-2"), brand = css("--brand"), ochre = css("--ochre");
  const font = { family: css("--font") || "Montserrat, sans-serif", size: 12 };
  Chart.defaults.font = font; Chart.defaults.color = muted;
  const tooltip = { backgroundColor: css("--bg"), titleColor: ink, bodyColor: ink, borderColor: css("--line"), borderWidth: 1, padding: 10, boxPadding: 4 };

  // Facturación mensual: estados de pago y anticipos, con pagado acumulado
  const C = R.contrato, meses = [], idx = {};
  R.eepp.forEach(e=>{ const [, m, y] = e[1].split("-"), k = `${y}-${m}`;
    if (!(k in idx)){ idx[k] = meses.length; meses.push({ k, lab:`${MES[+m-1]} ${y.slice(2)}`, ep:0, an:0, docs:[] }); }
    const o = meses[idx[k]]; if (e[0].startsWith("Anticipo")) o.an += e[9]; else o.ep += e[9]; o.docs.push(e[0]); });
  meses.sort((a,b)=>a.k.localeCompare(b.k));
  let ac = 0; const cum = meses.map(o => (ac += o.ep + o.an) / C.total * 100);
  const el = document.getElementById("ch-eepp");
  if (el) charts.push(new Chart(el, {
    data:{ labels: meses.map(o=>o.lab), datasets:[
      { type:"line", label:"Pagado acumulado", data:cum, borderColor:ink, backgroundColor:ink, borderWidth:2, pointRadius:2, yAxisID:"y2", tension:.15, order:0 },
      { type:"bar", label:"Estados de pago", data:meses.map(o=>o.ep), backgroundColor:brand, yAxisID:"y", stack:"m", barPercentage:.75, order:1 },
      { type:"bar", label:"Anticipos", data:meses.map(o=>o.an||null), backgroundColor:ochre, yAxisID:"y", stack:"m", barPercentage:.75, order:1 }
    ]},
    options:{ responsive:true, maintainAspectRatio:false, interaction:{ mode:"index", intersect:false },
      plugins:{ legend:{ display:false }, tooltip:{ ...tooltip, callbacks:{
        title: items => { const o = meses[items[0].dataIndex]; return `${o.lab.replace(" ", " 20")}: ${o.docs.length} documento${o.docs.length>1?"s":""}`; },
        label: c => c.raw==null ? null : c.dataset.yAxisID==="y2" ? `Pagado acumulado: ${n(c.raw,1)}% del contrato` : `${c.dataset.label}: ${uf(c.raw)}` } } },
      scales:{
        x:{ stacked:true, grid:{ display:false }, ticks:{ maxRotation:0, autoSkip:true, autoSkipPadding:6 } },
        y:{ position:"left", stacked:true, beginAtZero:true, suggestedMax:40000, grid:{ color:line }, ticks:{ callback:v=>n(v/1000,0)+" mil" }, title:{ display:true, text:"UF", color:muted } },
        y2:{ position:"right", min:0, max:100, grid:{ display:false }, ticks:{ callback:v=>v+"%", stepSize:20 } }
      } }
  }));
}

function spy(){
  const links = Object.fromEntries($$("#index a").map(a=>[a.dataset.id,a]));
  const ids = SECCIONES.map(s=>s[0]);
  const targets = ids.map(id=>document.getElementById(id)).filter(Boolean);
  if (window._io) window._io.disconnect();
  window._io = new IntersectionObserver(entries=>{
    entries.forEach(e=>{ if (e.isIntersecting){ const id = e.target.id === "regla" ? "resumen" : e.target.id;
      Object.values(links).forEach(a=>a.classList.remove("is-active"));
      const a = links[id]; if (a){ a.classList.add("is-active"); a.scrollIntoView({block:"nearest",inline:"nearest"}); } } });
  }, { rootMargin:"-30% 0px -65% 0px" });
  targets.concat(document.getElementById("regla")||[]).forEach(t=>window._io.observe(t));
}

  const i = INFORMES.indexOf(R), last = INFORMES.length - 1;
  const j = e.key==="ArrowRight" ? Math.min(i+1,last) : e.key==="ArrowLeft" ? Math.max(i-1,0) : e.key==="Home" ? 0 : e.key==="End" ? last : -1;
  if (j < 0) return; e.preventDefault(); selectReport(INFORMES[j].id, true);
});

/* Descarga del PDF: dentro de Claude usa la descarga con confirmación; en otros sitios el enlace abre el PDF. */
let DL = null, toastT;
try { if (window.claude && typeof window.claude.use === "function") window.claude.use("downloads").then(d=>{ DL = d; }, ()=>{}); } catch(_){}
const toast = (t, ms) => { clearTimeout(toastT); $("#toast").textContent = t; if (t && ms) toastT = setTimeout(()=>{ $("#toast").textContent = ""; }, ms); };
$("#pdf-btn").addEventListener("click", async e=>{
  if (!DL || !R.pdf) return;
  e.preventDefault();
  const a = e.currentTarget; if (a.getAttribute("aria-busy") === "true") return;
  a.setAttribute("aria-busy", "true"); toast("Preparando el PDF…");
  try {
    const res = await fetch(R.pdf); if (!res.ok) throw { code:"fetch" };
    const blob = await res.blob(); toast("");
    await DL.save({ filename: `${R.proyecto.codigo} Informe ejecutivo N° ${R.numero} ${R.periodo}.pdf`, data: blob });
  } catch (err) {
    const c = err && err.code;
    if (c === "declined") toast("");
    else if (c === "rate_limited") toast("Ya hay una descarga esperando confirmación.", 4000);
    else { DL = null; toast("No se pudo descargar aquí. Vuelve a hacer clic para abrir el PDF.", 6000); }
  } finally { a.removeAttribute("aria-busy"); }
});
$("#lb-prev").onclick = () => lbStep(-1);
$("#lb-next").onclick = () => lbStep(1);
$("#lb-close").onclick = () => $("#lb").close();
$("#lb").addEventListener("click", e=>{ if (e.target.id==="lb") $("#lb").close(); });
document.addEventListener("keydown", e=>{ if (!$("#lb").open) return; if (e.key==="ArrowRight") lbStep(1); if (e.key==="ArrowLeft") lbStep(-1); });
window.addEventListener("beforeprint", ()=> $$("details").forEach(d=>d.open=true));
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ()=>drawCharts(R));
new MutationObserver(()=>drawCharts(R)).observe(document.documentElement, { attributes:true, attributeFilter:["data-theme"] });
let rt; window.addEventListener("resize", ()=>{ clearTimeout(rt); rt = setTimeout(()=>charts.forEach(c=>c.resize()), 150); });

document.documentElement.lang = "es";
{ const m = /^#n(\d+)$/.exec(location.hash); const x = m && INFORMES.find(i=>String(i.numero)===m[1]); if (x) R = x; }
render();
if (document.fonts) document.fonts.ready.then(()=>drawCharts(R));
</script>
